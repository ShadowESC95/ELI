name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL_FILE: qwen2.5-1.5b-instruct-q4_k_m.gguf
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
  MODEL_SHA256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e

jobs:
  linux:
    # the oldest supported system: the AppImage starts on this one and anything newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries the app carries, and tools for the checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev libasound2-dev espeak-ng libespeak-ng1 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxcb-shape0 libxcb-randr0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Python packages (llama.cpp as its ready-made processor build)
        run: |
          python -m pip install --upgrade pip wheel
          pip install --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python
          pip install -r requirements.txt pyaudio pyinstaller huggingface_hub build

      - name: pip package (wheel and source)
        run: python -m build --outdir dist .

      - name: Speech model (packed in, so voice works offline)
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='build/whisper-base')"
          echo "d01c3014881c9c6f3133c182f3d2887eb6ca1c789a7538c5c007196857a0a6a9  build/whisper-base/model.bin" | sha256sum -c
          rm -rf build/whisper-base/.cache

      - name: Build
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/eli.spec
          python packaging/trim_bundle.py dist/ELI

      - name: Language model for the release (Qwen2.5 1.5B Instruct, Apache 2.0)
        run: |
          curl -fL --retry 3 -o "dist/$MODEL_FILE" "$MODEL_URL"
          echo "$MODEL_SHA256  dist/$MODEL_FILE" | sha256sum -c

      - name: Selftest (offscreen with the model and speech, then on a real X display)
        run: |
          espeak-ng -w build/speech.wav "open the calculator and play some music"
          ELI_GGUF_MODEL_PATH="$PWD/dist/$MODEL_FILE" ELI_SELFTEST_WAV="$PWD/build/speech.wav" dist/ELI/ELI --selftest
          xvfb-run -a env QT_QPA_PLATFORM=xcb dist/ELI/ELI --selftest

      - name: AppImage (and it finds the model saved beside it)
        run: |
          bash packaging/build_appimage.sh "${GITHUB_REF_NAME#v}"
          out="$(ELI_SELFTEST_WAV="$PWD/build/speech.wav" ./dist/ELI-*.AppImage --appimage-extract-and-run --selftest 2>&1)" \
            || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q -i "$MODEL_FILE: .*paris" || { echo "::error::the AppImage did not find the model beside it"; exit 1; }
          cd dist && sha256sum ELI-*.AppImage "$MODEL_FILE" *.whl *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: ELI-linux
          path: |
            dist/ELI-*.AppImage
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ELI ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release_notes.md \
            dist/ELI-*.AppImage "dist/$MODEL_FILE" dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
