[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-ai"
version = "0.1.1"
description = "ELI (Entropic Logical Interpreter): a local AI assistant for Linux with a desktop window, memory and voice"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "requests>=2.31",
  "numpy>=1.26",
  "platformdirs>=3",
  "llama-cpp-python>=0.2.90",
  "pyttsx3>=2.90",
  "SpeechRecognition>=3.10",
  "faster-whisper>=1.0",
  "pypdf>=4.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6", "soundfile>=0.12"]
plugins = ["playwright>=1.40", "chromadb>=0.4", "sentence-transformers>=2.2", "ics>=0.7"]
tools = ["pandas>=2.0", "ollama>=0.3"]
dev = ["pytest>=7"]

[project.scripts]
eli-gui = "eli.gui.app:main"
eli-daemon = "eli.brain.proactive_daemon:main"
eli-cli = "eli.tools.manage_eli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["eli.tests*"]

[tool.setuptools.package-data]
eli = ["brain/persona.txt", "api/favicon.ico", "modelfiles/*.Modelfile", "scripts/*.sh"]
